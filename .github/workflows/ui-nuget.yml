name: Hedin UI Nuget

permissions:
  contents: read
  id-token: write # OIDC token for NuGet trusted publishing
  
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.x'
      - name: Build
        run: dotnet build --configuration Release src/Hedin.UI/
      - name: Pack
        run: dotnet pack --configuration Release --no-build  src/Hedin.UI/
      # Exchange the GitHub OIDC token for a short-lived nuget.org API key
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email
      - name: Publish
        run: dotnet nuget push src/Hedin.UI/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate --timeout 600
